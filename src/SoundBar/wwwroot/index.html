<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Control your PC audio remotely with SoundBar Remote">
    <title>SoundBar Remote</title>
    <link rel="manifest" href="/manifest.json?v=3">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/style.css?v=5">
</head>

<body>
    <!-- Pairing Screen -->
    <div id="pairing-screen" class="screen active">
        <div class="pairing-card">
            <img class="pairing-logo" src="/icons/icon-192.png" alt="SoundBar">
            <h1 class="pairing-title">SoundBar Remote</h1>
            <p class="pairing-subtitle">Enter the 4-digit code shown in SoundBar on your PC.</p>

            <input type="text" id="pairing-code" maxlength="4" inputmode="numeric" pattern="[0-9]*"
                autocomplete="one-time-code" placeholder="----" aria-label="Pairing code">

            <button id="pair-btn" class="btn-primary" disabled>Connect</button>
            <div id="pairing-error" class="error-text" role="alert"></div>

            <div id="connection-status" class="connection-indicator">
                <span class="status-dot disconnected"></span>
                <span>Connecting...</span>
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen">
        <header class="app-header">
            <div class="brand">
                <img class="brand-logo" src="/icons/icon-192.png" alt="">
                <span class="brand-name">SoundBar</span>
            </div>
            <div class="header-actions">
                <div id="client-status-pill" class="status-pill">
                    <span class="status-dot connected"></span>
                    <span id="client-status" class="status-text">Connected</span>
                </div>
                <button id="theme-toggle-btn" class="icon-btn" title="Switch theme" aria-label="Switch theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="app-content">
            <div class="column column-main">
                <!-- Master Volume -->
                <section class="card master-card" aria-labelledby="master-title">
                    <div class="card-header">
                        <h2 id="master-title" class="card-title">Master Volume</h2>
                        <span id="master-value" class="master-value">50%</span>
                    </div>
                    <div class="slider-row">
                        <button id="master-mute-btn" class="mute-btn" title="Mute" aria-label="Mute">
                            <span class="mute-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                                </svg></span>
                        </button>
                        <input type="range" id="master-slider" class="volume-slider" min="0" max="100" value="50"
                            aria-label="Master volume">
                    </div>
                </section>

                <!-- Now Playing (only shown while something's playing) -->
                <section id="now-playing-card" class="card now-playing-card hidden" aria-labelledby="now-playing-title">
                    <div class="card-header">
                        <h2 id="now-playing-title" class="card-title">Now Playing</h2>
                    </div>
                    <div class="now-playing-content">
                        <div class="album-art-container">
                            <img id="album-art" src="" alt="Album art">
                            <div class="album-art-placeholder"><svg width="28" height="28" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M9 18V5l12-2v13"></path>
                                    <circle cx="6" cy="18" r="3"></circle>
                                    <circle cx="18" cy="16" r="3"></circle>
                                </svg></div>
                        </div>
                        <div class="now-playing-info">
                            <div id="song-title" class="song-title">Nothing playing</div>
                            <div id="song-artist" class="song-artist"></div>
                        </div>
                    </div>
                    <div class="progress-container">
                        <input type="range" id="seek-slider" class="seek-slider" min="0" max="100" value="0" step="0.1"
                            aria-label="Song position">
                        <div class="time-display">
                            <span id="current-time">0:00</span>
                            <span id="total-time">0:00</span>
                        </div>
                    </div>
                    <div class="media-controls">
                        <button id="prev-btn" class="media-btn" title="Previous" aria-label="Previous"><svg width="20"
                                height="20" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                                <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line>
                            </svg></button>
                        <button id="play-pause-btn" class="media-btn media-btn-primary" title="Play/Pause"
                            aria-label="Play or pause"><svg width="22" height="22" viewBox="0 0 24 24"
                                fill="currentColor">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg></button>
                        <button id="next-btn" class="media-btn" title="Next" aria-label="Next"><svg width="20"
                                height="20" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                                <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line>
                            </svg></button>
                    </div>
                </section>

                <!-- Devices -->
                <section class="card devices-card" aria-labelledby="devices-title">
                    <div class="card-header">
                        <h2 id="devices-title" class="card-title">Devices</h2>
                    </div>

                    <label class="field-label" for="device-select">Output</label>
                    <div class="select-wrap">
                        <select id="device-select" class="device-select">
                            <option value="">Loading devices...</option>
                        </select>
                    </div>

                    <label class="field-label" for="input-device-select">Microphone</label>
                    <div class="device-row">
                        <div class="select-wrap">
                            <select id="input-device-select" class="device-select">
                                <option value="">Loading microphones...</option>
                            </select>
                        </div>
                        <button id="input-mute-btn" class="mute-btn" title="Mute microphone"
                            aria-label="Mute microphone">
                            <span class="mute-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                    <line x1="12" y1="19" x2="12" y2="23"></line>
                                    <line x1="8" y1="23" x2="16" y2="23"></line>
                                </svg></span>
                        </button>
                    </div>
                </section>
            </div>

            <div class="column column-side">
                <!-- Apps -->
                <section class="card apps-card" aria-labelledby="apps-title">
                    <div class="card-header">
                        <h2 id="apps-title" class="card-title">Apps</h2>
                        <span id="apps-count" class="count-badge hidden">0</span>
                    </div>
                    <div id="apps-list" class="apps-list">
                        <div class="empty-state">No apps are playing audio right now</div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="/app.js?v=14"></script>
</body>

</html>
